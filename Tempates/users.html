<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
        }
        input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 400px;
        }
        .close-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add User</h1>

        <!-- Form to add user -->
        <form action="/add_user" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <button type="submit">Add User</button>
        </form>
        <a href="manager-home.html">Back to Main Page</a>
    </div>

    <!-- Modal for flash message -->
    <div id="flash-modal" class="modal">
        <div class="modal-content">
            <p id="flash-message"></p>
            <button class="close-button" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // JavaScript function to display flash messages as a modal popup
        window.onload = function() {
            // Get the flash message from the hidden div
            var flashMessageElement = document.getElementById('flash-message');
            var modal = document.getElementById('flash-modal');
            
            // Flash message content (modify based on your backend flash messages)
            var flashMessage = "{% with messages = get_flashed_messages() %}{% if messages %}{{ messages[0] }}{% endif %}{% endwith %}";

            // If there's a flash message, show the modal popup
            if (flashMessage.trim() !== '') {
                flashMessageElement.innerText = flashMessage;
                modal.style.display = 'flex'; // Show the modal
            }
        }

        // Function to close the modal
        function closeModal() {
            var modal = document.getElementById('flash-modal');
            modal.style.display = 'none'; // Hide the modal
        }
    </script>

</body>
</html>
